[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investai_meta"
version = "0.1.0"
description = "InvestAI: agente de recomendação de investimentos (pasta 2, com metacognição)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
